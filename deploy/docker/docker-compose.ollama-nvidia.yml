# NVIDIA GPU for Ollama only; the jarvis server keeps the CPU image (with the
# Discord and speech extras). Use with:
#   docker compose -f deploy/docker/docker-compose.yml \
#     -f deploy/docker/docker-compose.ollama-nvidia.yml up -d
# docker-compose.gpu.nvidia.yml additionally rebuilds jarvis from Dockerfile.gpu,
# which is only needed for GPU engines inside the server container (vLLM etc.).

services:
  ollama:
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
